name: tests

on:
  workflow_dispatch:
  pull_request:
    branches: [development, main]
  workflow_run:
    workflows: [codestyle]
    types: [completed]

jobs:
  workbench-tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4]
        laravel: [^12, ^11]
        livewire: [^3, ^4@beta]
        stability: [prefer-lowest, prefer-stable]

    name: LV${{ matrix.livewire }} - L${{ matrix.laravel }} - P${{ matrix.php }} - ${{ matrix.stability }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: xdebug

      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Restore Composer Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependecies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "livewire/livewire:${{ matrix.livewire }}" --no-interaction --no-update
          composer update --no-progress --optimize-autoloader --${{ matrix.stability }}

      - name: Directory Permissions
        run: sudo chown -R $(whoami) vendor/pestphp/pest/.temp vendor/orchestra

      - name: Run tests - coverage threshold 80%
        run: composer test -- --coverage --min=80 --coverage-clover clover.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
